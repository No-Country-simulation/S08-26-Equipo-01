spring.application.name=qualitytrack

spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true

security.auth.email-verification-expiration=${EMAIL_VERIFICATION_EXPIRATION:24h}
security.auth.password-reset-expiration=${PASSWORD_RESET_EXPIRATION:30m}

security.jwt.secret=${JWT_SECRET}
security.jwt.access-expiration=${JWT_ACCESS_EXPIRATION:15m}
security.jwt.issuer=${JWT_ISSUER:qualitytrack}

security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

app.frontend.base-url=${FRONTEND_BASE_URL:http://localhost:5173}

app.email.resend.api-key=${RESEND_APIKEY}
app.email.resend.from=${RESEND_EMAIL}
